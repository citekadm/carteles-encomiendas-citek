<style id="estilos">
/* ===== Interfaz (solo pantalla): neumorfismo claro (relieves suaves con luz y sombra) y acento azul ===== */
:root { --bg:#e8ecf2; --txt:#454e61; --sub:#6c778b; --sub2:#8993a6; --luz:rgba(255,255,255,.95); --som:rgba(155,170,196,.55);
  --ac:#6f9bf2; --ac2:#93b6fb; --ac3:#4f7fdc; --ok:#3fae86; --err:#d9647c; --cara:linear-gradient(145deg,#eff2f8,#e5e9f0);
  --relieve: 10px 10px 22px var(--som), -10px -10px 22px var(--luz); --relieve-s: 6px 6px 13px var(--som), -6px -6px 13px var(--luz);
  --hundido: inset 5px 5px 10px var(--som), inset -5px -5px 10px var(--luz); }
@media screen { :root { color-scheme: light; } }
* { box-sizing: border-box; scrollbar-color: #c3cbda transparent; }
::selection { background: rgba(111,155,242,.28); }
[hidden] { display: none !important; }
body { margin: 0; color: var(--txt); font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; -webkit-font-smoothing: antialiased; background: var(--bg); }
.app { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; }
.top { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 0; margin-bottom: 8px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
.brand { display: flex; align-items: center; gap: 14px; }
.logo-citek { display: block; height: 42px; width: auto; filter: drop-shadow(2px 3px 3px rgba(120,135,165,.45)); user-select: none; }
.solo-lector { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.estado { display: inline-flex; align-items: center; gap: 9px; max-width: 460px; padding: 9px 16px; border-radius: 999px; background: var(--cara); box-shadow: var(--relieve-s); font-size: 13px; color: var(--sub); }
.estado::before { content: ""; flex: none; width: 9px; height: 9px; border-radius: 50%; background: #aab3c4; box-shadow: inset 1px 1px 2px rgba(0,0,0,.2); }
.estado.ok { color: var(--txt); } .estado.ok::before { background: var(--ok); box-shadow: 0 0 8px rgba(63,174,134,.7); }
.estado.error { color: var(--err); } .estado.error::before { background: var(--err); box-shadow: 0 0 8px rgba(217,100,124,.7); }
.grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr) minmax(0,1fr); gap: 26px; align-items: start; }
.col, .col2, .col3 { display: flex; flex-direction: column; gap: 26px; }
@media (max-width: 1000px) { .grid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .col3 { grid-column: 1 / -1; } #prev { max-width: 440px; width: 100%; align-self: center; } }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.card { background: var(--cara); border-radius: 30px; padding: 24px; box-shadow: var(--relieve); }
.card h2 { margin: 0 0 4px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .22em; color: var(--sub2); }
label.f { display: block; margin: 18px 0 8px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .12em; color: var(--sub); }
.card input[type=text], .card textarea { width: 100%; font: inherit; color: var(--txt); padding: 13px 18px; border: 0; border-radius: 18px; background: #e9edf3; box-shadow: var(--hundido); outline: none; transition: box-shadow .15s; }
.card input[type=text]::placeholder, .card textarea::placeholder { color: #a0a9b9; }
.card input[type=text]:focus, .card textarea:focus { box-shadow: var(--hundido), 0 0 0 3px rgba(111,155,242,.4); }
.card textarea { resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.buscador { position: relative; }
.lupa { position: absolute; left: 18px; bottom: 14px; width: 20px; height: 20px; color: var(--sub2); pointer-events: none; }
#f-buscar { padding-left: 48px; }
.sugerencias { position: absolute; left: 0; right: 0; z-index: 10; margin: 10px 0 0; padding: 8px; list-style: none; background: var(--cara); border-radius: 22px;
  box-shadow: 10px 14px 30px var(--som), -4px -4px 14px var(--luz); max-height: 340px; overflow: auto; animation: sube .14s ease-out; }
.sugerencias li { padding: 10px 14px; border-radius: 14px; cursor: pointer; }
.sugerencias li.sel, .sugerencias li:hover { background: rgba(111,155,242,.15); color: var(--ac3); }
.aviso { font-size: 13px; color: var(--sub); margin: 8px 2px 0; }
.nota { margin: -2px 0 6px; font-size: 12px; color: var(--sub); }
.chip { display: inline-block; margin: 14px 0 0; padding: 6px 14px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.chip.base { background: rgba(63,174,134,.14); color: var(--ok); }
.chip.manual { background: rgba(111,155,242,.16); color: var(--ac3); }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 22px; font-size: 14px; font-weight: 500; cursor: pointer; }
input.switch { appearance: none; -webkit-appearance: none; flex: none; width: 60px; height: 34px; margin: 0 5px 0 0; border-radius: 999px; position: relative; cursor: pointer; background: #e0e5ed;
  box-shadow: inset 3px 3px 7px var(--som), inset -3px -3px 7px var(--luz), 0 0 0 4px #eef1f6, 0 0 0 5px rgba(155,170,196,.4); transition: background .2s, box-shadow .2s; }
input.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 26px; height: 26px; border-radius: 50%; background: linear-gradient(145deg,#f8fafd,#dce1e9);
  box-shadow: 4px 4px 9px var(--som), -2px -2px 6px var(--luz); transition: transform .22s cubic-bezier(.3,.7,.4,1); }
input.switch:checked { background: linear-gradient(145deg,#8bb0fb,#6a97f1); box-shadow: inset 3px 3px 7px rgba(70,110,200,.5), inset -3px -3px 7px rgba(165,198,255,.6), 0 0 0 4px #eef1f6, 0 0 0 5px rgba(155,170,196,.4); }
input.switch:checked::after { transform: translateX(26px); }
input.switch:disabled { opacity: .5; cursor: not-allowed; }
input.switch:focus-visible, .btn:focus-visible, .btn-paso:focus-visible { outline: 3px solid rgba(111,155,242,.5); outline-offset: 3px; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 14px; margin-top: 18px; }
.stat { background: var(--cara); box-shadow: var(--relieve-s); border-radius: 22px; padding: 16px 8px; text-align: center; }
.stat b { display: block; font-size: 30px; line-height: 1.1; font-weight: 600; letter-spacing: -.02em; color: var(--txt); }
.stat span { font-size: 10px; text-transform: uppercase; letter-spacing: .12em; color: var(--sub2); }
#resumen-txt { margin: 16px 2px 0; font-size: 13px; color: var(--sub); }
#resumen.error #resumen-txt { color: var(--err); font-weight: 600; }
.acciones { display: grid; grid-template-columns: 1fr 1.25fr 1.1fr; gap: 12px; }
.acciones .btn.prim { grid-column: 1 / -1; font-size: 15px; }
.acciones .btn { padding: 0 6px; font-size: 13px; white-space: nowrap; }
.btn { font: inherit; font-weight: 600; height: 50px; padding: 0 18px; border: 0; border-radius: 18px; cursor: pointer; color: var(--sub); background: var(--cara); box-shadow: var(--relieve-s); transition: color .15s, box-shadow .12s, filter .12s; }
.btn:hover { color: var(--ac3); } .btn:active { box-shadow: var(--hundido); }
.btn.prim { color: #fff; background: linear-gradient(145deg, var(--ac2), var(--ac)); text-shadow: 0 1px 1px rgba(50,90,190,.35); box-shadow: 7px 9px 18px rgba(90,134,224,.42), -6px -6px 14px var(--luz), inset 0 1px 0 rgba(255,255,255,.38); }
.btn.prim:hover { color: #fff; filter: brightness(1.05); }
.btn.prim:active { box-shadow: inset 4px 4px 10px rgba(50,90,190,.45), inset -3px -3px 8px rgba(165,198,255,.5); }
.btn.fuera { color: var(--err); }
.btn.sm { height: 40px; padding: 0 18px; font-size: 13px; border-radius: 999px; }
.btn.nuevo-cli { width: 100%; margin-top: 24px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ac3); }
.btn.nuevo-cli .mas { font-size: 22px; font-weight: 500; line-height: 1; margin-top: -2px; }
.avisos { color: var(--err); font-weight: 600; font-size: 14px; }
.avisos:empty { display: none; }
.stepper { display: flex; gap: 14px; align-items: center; }
.stepper input { flex: 1; min-width: 0; }
.paso { display: flex; gap: 12px; }
.btn-paso { width: 48px; height: 48px; padding: 0; border: 0; border-radius: 50%; cursor: pointer; display: grid; place-items: center; font-size: 26px; font-weight: 400; line-height: 1; color: var(--sub); background: var(--cara); box-shadow: var(--relieve-s); transition: color .15s, box-shadow .12s; }
.btn-paso:hover { color: var(--ac3); } .btn-paso:active { box-shadow: var(--hundido); }
/* Selector tipo «knob» (cajas por bulto: 1, 2 o 3): perilla en relieve con puntos alrededor; el punto azul marca la opción elegida */
.dial { position: relative; width: 236px; margin: 8px auto 6px; aspect-ratio: 200 / 172; touch-action: none; cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.dial svg { display: block; width: 100%; height: 100%; overflow: visible; }
.dial .punto { fill: #b6bfcf; } .dial .punto.fuerte { fill: #a2acc0; }
.dial .punto.act { fill: var(--ac); filter: drop-shadow(0 0 4px rgba(111,155,242,.85)); }
.dial-knob { position: absolute; left: 50%; top: 57%; width: 54%; aspect-ratio: 1; transform: translate(-50%,-50%); border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 32% 28%, #ffffff, #eaeef4 55%, #dde2ea);
  box-shadow: 9px 11px 22px var(--som), -8px -8px 18px var(--luz), inset -4px -5px 9px rgba(155,170,196,.45), inset 4px 4px 9px rgba(255,255,255,.95); }
.dial-giro { position: absolute; inset: 0; transform: rotate(var(--ang, 120deg)); transition: transform .28s cubic-bezier(.3,.8,.4,1); }
.dial-giro::before { content: ""; position: absolute; left: 50%; top: 9%; width: 4px; height: 17%; margin-left: -2px; border-radius: 2px; background: linear-gradient(#9aa5b8,#7f8aa0); box-shadow: inset 1px 1px 2px rgba(0,0,0,.25), 1px 1px 1px var(--luz); }
.dial-knob b { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 6%; font-size: 32px; font-weight: 600; color: var(--sub); }
.dial-pos { position: absolute; width: 30px; height: 30px; padding: 0; transform: translate(-50%,-50%); border: 0; border-radius: 50%; background: transparent; color: var(--sub2); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; transition: color .15s; }
.dial-pos:hover, .dial-pos.on { color: var(--ac3); }
.dial-pos[data-v="1"] { left: 11%; top: 83.1%; } .dial-pos[data-v="2"] { left: 50%; top: 4.7%; } .dial-pos[data-v="3"] { left: 89%; top: 83.1%; }
.dial:focus-visible { outline: 3px solid rgba(111,155,242,.5); outline-offset: 6px; border-radius: 24px; }
/* Vista previa reducida: es solo una referencia (la impresión usa las hojas a tamaño real) */
#prev { min-height: 300px; }
.prev-info { margin: 0 0 14px; font-size: 12px; color: var(--sub); }
.prev-info:empty { display: none; }
.prev-body { display: grid; justify-content: center; animation: sube .2s ease-out; }
.col3 { position: sticky; top: 84px; }
.vista { zoom: .3; } .vista .hoja { box-shadow: 0 6px 18px rgba(120,135,165,.4), 0 0 0 1px rgba(155,170,196,.35); } /* el zoom real lo calcula escalarVista() según el ancho de la tarjeta */
@media (max-width: 520px) { .acciones { grid-template-columns: 1fr 1fr; } }
#impresion { display: none; }
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(170,180,200,.45); -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px); opacity: 0; transition: opacity .18s; }
.modal.abierto { opacity: 1; }
.modal-card { width: min(92vw, 380px); max-height: 90vh; overflow: auto; text-align: center; background: var(--cara); border-radius: 32px; padding: 32px 28px 26px; box-shadow: 14px 16px 36px var(--som), -10px -10px 26px var(--luz);
  transform: scale(.92); transition: transform .22s cubic-bezier(.3,.9,.4,1.2); }
.modal.abierto .modal-card { transform: scale(1); }
.modal-card h2 { margin: 18px 0 8px; font-size: 20px; letter-spacing: -.01em; text-transform: none; font-weight: 600; color: var(--txt); }
.modal-card p { margin: 0 0 20px; color: var(--sub); white-space: pre-line; }
.modal-card img { max-width: 100%; border-radius: 14px; box-shadow: var(--relieve-s); margin-bottom: 20px; }
.modal-card .btn { width: 100%; }
.modal-card .btn + .btn { margin-top: 0; }
.m-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.modal-card label.f { text-align: left; margin: 4px 0 8px; }
.modal-card input[type=text] { width: 100%; font: inherit; color: var(--txt); padding: 13px 18px; border: 0; border-radius: 18px; background: #e9edf3; box-shadow: var(--hundido); outline: none; margin-bottom: 20px; }
.modal-card input[type=text]:focus { box-shadow: var(--hundido), 0 0 0 3px rgba(111,155,242,.4); }
.m-icono { position: relative; width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 700; box-shadow: 6px 8px 16px var(--som), -5px -5px 12px var(--luz); }
.m-ok { background: linear-gradient(145deg,#5ccba3,#3fae86); } .m-ok::after { content: ""; position: absolute; left: 24px; top: 11px; width: 13px; height: 26px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(45deg); animation: sube .3s ease-out; }
.m-error { background: linear-gradient(145deg,#ee8aa0,#d9647c); }
.m-info { background: linear-gradient(145deg, var(--ac2), var(--ac)); }
.m-carga { background: transparent; box-shadow: none; border: 5px solid #d9dfea; border-top-color: var(--ac); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@keyframes sube { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== Hoja y cartel (misma estructura en vista previa e impresión) ===== */
.hoja, .cartel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.hoja { display: block; width: 210mm; height: 296mm; background: #fff; overflow: hidden; break-after: page; }
.hoja:last-child { break-after: auto; }
.cartel { width: 100%; height: 148mm; padding: 5mm 9mm; display: flex; flex-direction: column; align-items: center;
  text-align: center; overflow: hidden; background: #fff; color: #000; line-height: 1.05;
  font-family: "Times New Roman", Times, "Liberation Serif", serif; }
.hoja .cartel:first-child { border-bottom: .3mm dashed #000; } /* línea de corte */
.cartel > * { max-width: 100%; overflow-wrap: break-word; }

/* ===== Cartel (cuadros) =====
   La altura se reparte entre los recuadros por pesos (flex) y cada texto crece hasta el MAYOR tamaño que entra en su recuadro
   (ajustarE en JavaScript.html). Una palabra: una línea. Varias palabras: hasta 2 líneas. El remitente tiene tamaño fijo. */
.cartel-e { padding: 5mm 7mm; gap: 2mm; align-items: stretch; justify-content: flex-start; }
.cartel-e .fit { display: block; width: 100%; min-width: 0; font-size: 400px; line-height: 1.05; overflow-wrap: normal; word-break: normal; hyphens: none; }
.cartel-e .fit.uno { white-space: nowrap; }
.e-box { border: .5mm solid #000; padding: 1mm 2.5mm; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; }
.e-top, .e-foot { display: flex; gap: 2mm; flex: none; }
.e-top { height: 18mm; } .e-foot { height: 22mm; }
.e-top > *, .e-foot > * { flex: 1 1 0; min-width: 0; }
.e-factura { background: #ff0; }
.e-fant, .e-prim { flex: 2.6 1 0; min-height: 0; }   /* nombre fantasía: el texto principal del cartel */
.e-razon { flex: 1.5 1 0; min-height: 0; }
.e-dt { flex: 1.6 1 0; min-height: 0; flex-direction: row; padding: 0; align-items: stretch; justify-content: stretch; }
.e-celda { flex: 1 1 0; min-width: 0; padding: 1mm 2.5mm; display: flex; align-items: center; justify-content: center; }
.e-celda + .e-celda { border-left: .5mm solid #000; }
.e-depto { flex: 3.3 1 0; min-height: 0; }
.e-rte { gap: 0; }
.e-rte .rte1 { color: #f00; font-size: 26px; line-height: 1.05; margin-top: 1.5mm; }
.e-rte .rte2 { color: #f00; font-size: 17px; line-height: 1.05; }
.e-fant .fit, .e-prim .fit, .e-depto .fit, .e-cond .fit, .e-factura .fit, .e-bulto .fit { font-weight: 700; }
.e-depto .fit, .e-cond .fit, .e-factura .fit { text-transform: uppercase; }
/* Marca de agua fija: logo de CITEK centrado detrás de todo el cartel. Es una imagen negra con transparencia: la opacidad la vuelve un gris
   suave (en impresoras en blanco y negro sale como trama clara). Los recuadros son transparentes para que se vea por debajo del texto. */
.cartel { position: relative; }
.marca { position: absolute; z-index: 0; pointer-events: none; user-select: none; }
.cartel > :not(.marca) { position: relative; z-index: 1; }
.marca-todo { left: 50%; top: 50%; width: 60%; height: auto; transform: translate(-50%,-50%); opacity: .09; }
/* FRÁGIL: una hoja A4 apaisada por bulto; cartel al centro y dos franjas laterales solo con contorno (sin relleno, para ahorrar tinta) */
.hoja.fragil { width: 297mm; height: 209mm; display: flex; align-items: stretch; }
.barra-fragil { flex: none; width: 33.3mm; margin: 6.35mm 0 6.35mm 6.35mm; border: 1.3mm solid #000; background: #fff; color: #000; display: flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl; font: 700 104px/1.05 "Times New Roman", Times, "Liberation Serif", serif; letter-spacing: .14em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.barra-fragil.b-izq { transform: rotate(180deg); }
.barra-fragil.b-der { margin: 6.35mm 6.35mm 6.35mm 0; }
.cartel.cartel-e.ancha { width: 217.7mm; height: 209mm; padding: 6.35mm; border-bottom: 0; flex: none; }
.ancha .e-top { height: 20.5mm; } .ancha .e-foot { height: 26mm; }
.ancha .e-rte .rte1 { font-size: 30px; } .ancha .e-rte .rte2 { font-size: 20px; }
.nota { margin: -2px 0 6px; font-size: 12px; color: var(--sub); }

/* ===== Impresión A4 vertical (con FRÁGIL, JavaScript.html agrega @page apaisada en #pagina) ===== */
@page { size: A4 portrait; margin: 0; }
@media print {
  html, body { margin: 0; padding: 0; background: #fff; height: auto; overflow: visible; }
  .no-print { display: none !important; }
  #impresion { display: block; }
}
</style>
