<style id="estilos">
/* ===== Interfaz (solo pantalla): tema oscuro, tarjetas con relieve y acento violeta ===== */
:root { --bg:#13141b; --card:#1d1e27; --card2:#252631; --txt:#f1f1f6; --sub:#a3a4b5; --line:rgba(255,255,255,.08); --fill:#15161d; --tint:#a78bfa; --tint2:#7c5cf0; --ok:#3ddc97; --cyan:#4cc9f0; --err:#ff6b81;
  --relieve: 0 18px 40px rgba(0,0,0,.45), 0 2px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  --hundido: inset 0 2px 7px rgba(0,0,0,.55), inset 0 -1px 0 rgba(255,255,255,.05); }
@media screen { :root { color-scheme: dark; } }
* { box-sizing: border-box; scrollbar-color: #3a3b4a transparent; }
::selection { background: rgba(167,139,250,.35); }
[hidden] { display: none !important; }
body { margin: 0; color: var(--txt); font: 15px/1.45 Inter, "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif; -webkit-font-smoothing: antialiased;
  background: radial-gradient(900px 520px at 88% -8%, rgba(124,92,240,.20), transparent 62%), radial-gradient(800px 480px at -8% 108%, rgba(76,201,240,.08), transparent 60%), var(--bg); background-attachment: fixed; }
.app { max-width: 1120px; margin: 0 auto; padding: 0 20px 40px; }
.top { position: sticky; top: 0; z-index: 20; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px 0; margin-bottom: 8px;
  background: color-mix(in srgb, var(--bg) 72%, transparent); -webkit-backdrop-filter: saturate(160%) blur(18px); backdrop-filter: saturate(160%) blur(18px); }
.brand { display: flex; align-items: center; gap: 14px; }
.logo-citek { display: block; height: 42px; width: auto; filter: drop-shadow(0 0 14px rgba(167,139,250,.45)) drop-shadow(0 2px 4px rgba(0,0,0,.5)); user-select: none; }
.solo-lector { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.top-r { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.estado { display: inline-flex; align-items: center; gap: 9px; max-width: 460px; padding: 7px 14px; border-radius: 999px; background: linear-gradient(150deg,var(--card2),var(--card)); box-shadow: var(--relieve); font-size: 13px; color: var(--sub); }
.estado::before { content: ""; flex: none; width: 8px; height: 8px; border-radius: 50%; background: #6b6c7e; }
.estado.ok { color: var(--txt); } .estado.ok::before { background: var(--ok); box-shadow: 0 0 10px var(--ok); }
.estado.error { color: var(--err); } .estado.error::before { background: var(--err); box-shadow: 0 0 10px var(--err); }
.grid { display: grid; grid-template-columns: minmax(0,1.15fr) minmax(0,1fr) 224px; gap: 22px; align-items: start; }
.col, .col2, .col3 { display: flex; flex-direction: column; gap: 22px; }
@media (max-width: 1000px) { .grid { grid-template-columns: minmax(0,1fr) minmax(0,1fr); } .col3 { grid-column: 1 / -1; align-items: center; } }
@media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
.card { background: linear-gradient(150deg, var(--card2), var(--card) 55%); border: 1px solid rgba(255,255,255,.035); border-radius: 28px; padding: 22px; box-shadow: var(--relieve); }
.card h2 { margin: 0 0 4px; font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .18em; color: var(--sub); }
label.f { display: block; margin: 15px 0 7px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--sub); }
.card input[type=text], .card textarea { width: 100%; font: inherit; color: var(--txt); padding: 12px 16px; border: 1.5px solid transparent; border-radius: 16px; background: var(--fill); box-shadow: var(--hundido); outline: none; transition: border-color .15s, box-shadow .15s; }
.card input[type=text]::placeholder, .card textarea::placeholder { color: #6f7084; }
.card input[type=text]:focus, .card textarea:focus { border-color: var(--tint); box-shadow: var(--hundido), 0 0 0 4px rgba(167,139,250,.18); }
.card textarea { resize: vertical; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.buscador { position: relative; }
.sugerencias { position: absolute; left: 0; right: 0; z-index: 10; margin: 8px 0 0; padding: 6px; list-style: none; background: linear-gradient(150deg,#2a2b37,#1f2029); border: 1px solid rgba(255,255,255,.07);
  border-radius: 18px; box-shadow: 0 18px 48px rgba(0,0,0,.65); max-height: 340px; overflow: auto; animation: sube .14s ease-out; }
.sugerencias li { padding: 10px 12px; border-radius: 12px; cursor: pointer; }
.sugerencias li.sel, .sugerencias li:hover { background: rgba(167,139,250,.18); }
.aviso { font-size: 13px; color: var(--sub); margin: 8px 2px 0; }
.chip { display: inline-block; margin: 12px 0 0; padding: 5px 13px; border-radius: 999px; font-size: 12px; font-weight: 600; }
.chip.base { background: rgba(61,220,151,.14); color: var(--ok); }
.chip.manual { background: rgba(167,139,250,.16); color: var(--tint); }
.sw { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 16px; font-weight: 500; cursor: pointer; }
input.switch { appearance: none; -webkit-appearance: none; flex: none; width: 58px; height: 32px; margin: 0; border-radius: 999px; background: #13141a; box-shadow: var(--hundido); position: relative; cursor: pointer; transition: background .2s; }
input.switch::after { content: ""; position: absolute; top: 4px; left: 4px; width: 24px; height: 24px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #707184, #4a4b59); box-shadow: 0 3px 8px rgba(0,0,0,.55); transition: transform .2s cubic-bezier(.3,.7,.4,1), background .2s, box-shadow .2s; }
input.switch:checked { background: #2a2552; }
input.switch:checked::after { transform: translateX(26px); background: radial-gradient(circle at 35% 30%, #e6dcff, #a78bfa); box-shadow: 0 0 14px rgba(167,139,250,.75), 0 3px 8px rgba(0,0,0,.5); }
input.switch:disabled { opacity: .45; cursor: not-allowed; }
input.switch:focus-visible, .btn:focus-visible, .btn-paso:focus-visible, .seg button:focus-visible { outline: 3px solid rgba(167,139,250,.5); outline-offset: 2px; }
.stats { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-top: 14px; }
.stat { background: var(--fill); box-shadow: var(--hundido); border-radius: 20px; padding: 14px 8px; text-align: center; }
.stat b { display: block; font-size: 32px; line-height: 1.1; letter-spacing: -.02em; }
.stat span { font-size: 12px; color: var(--sub); }
#resumen-txt { margin: 14px 2px 0; font-size: 13px; color: var(--sub); }
#resumen.error #resumen-txt { color: var(--err); font-weight: 600; }
.acciones { display: grid; grid-template-columns: 1fr 1.3fr 1.15fr; gap: 10px; }
.acciones .btn.prim { grid-column: 1 / -1; }
.acciones .btn { padding: 0 8px; font-size: 14px; white-space: nowrap; }
.acciones .btn.prim { font-size: 15px; }
.btn { font: inherit; font-weight: 600; height: 48px; padding: 0 16px; border: 1px solid rgba(255,255,255,.05); border-radius: 16px; cursor: pointer; color: #cfc2ff;
  background: linear-gradient(150deg,#2b2c38,#1e1f28); box-shadow: 0 8px 18px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07); transition: transform .12s, filter .12s, box-shadow .12s; }
.btn:hover { filter: brightness(1.15); } .btn:active { transform: scale(.97); box-shadow: var(--hundido); }
.btn.prim { color: #fff; border-color: transparent; background: linear-gradient(135deg, var(--tint2), var(--tint)); box-shadow: 0 10px 26px rgba(124,92,240,.45), inset 0 1px 0 rgba(255,255,255,.28); }
.btn.fuera { color: var(--err); }
.btn.sm { height: 38px; padding: 0 16px; font-size: 13px; border-radius: 999px; }
.btn.nuevo-cli { width: 100%; margin-top: 20px; display: flex; align-items: center; justify-content: center; gap: 8px; color: var(--ok); }
.btn.nuevo-cli .mas { font-size: 22px; font-weight: 500; line-height: 1; margin-top: -2px; }
.avisos { color: var(--err); font-weight: 600; font-size: 14px; }
.avisos:empty { display: none; }
details.card { padding: 0; overflow: hidden; }
details.card summary { list-style: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; cursor: pointer; font-weight: 600; }
details.card summary::-webkit-details-marker { display: none; }
details.card summary small { margin-left: auto; font-weight: 400; color: var(--sub); }
details.card summary::after { content: ""; width: 9px; height: 9px; border: solid var(--sub); border-width: 0 2px 2px 0; transform: rotate(45deg); transition: transform .2s; margin: -4px 4px 0 6px; }
details.card[open] summary::after { transform: rotate(-135deg); margin-top: 4px; }
.prev-body { padding: 4px 20px 20px; display: grid; justify-content: center; animation: sube .2s ease-out; }
.modal-card .btn + .btn { margin-top: 0; }
.m-botones { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.modal-card label.f { text-align: left; margin: 4px 0 7px; }
.modal-card input[type=text] { width: 100%; font: inherit; color: var(--txt); padding: 12px 16px; border: 1.5px solid transparent; border-radius: 16px; background: var(--fill); box-shadow: var(--hundido); outline: none; margin-bottom: 18px; }
.modal-card input[type=text]:focus { border-color: var(--tint); box-shadow: var(--hundido), 0 0 0 4px rgba(167,139,250,.18); }
.stepper { display: flex; gap: 12px; align-items: center; }
.stepper input { flex: 1; min-width: 0; }
.paso { display: flex; gap: 10px; }
.btn-paso { width: 46px; height: 46px; padding: 0; border: 1px solid rgba(255,255,255,.05); border-radius: 50%; cursor: pointer; display: grid; place-items: center; font-size: 26px; font-weight: 400; line-height: 1; color: var(--tint);
  background: linear-gradient(150deg,#2b2c38,#1e1f28); box-shadow: 0 8px 16px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07); transition: transform .12s, filter .12s, box-shadow .12s; }
.btn-paso:hover { filter: brightness(1.2); } .btn-paso:active { transform: scale(.93); box-shadow: var(--hundido); }
.seg { display: flex; gap: 2px; padding: 4px; border-radius: 999px; background: var(--fill); box-shadow: var(--hundido); }
.seg button { flex: 1; height: 38px; border: 0; border-radius: 999px; background: transparent; color: var(--sub); font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s, color .2s, box-shadow .2s; }
.seg button.on { color: #fff; background: linear-gradient(135deg, var(--tint2), var(--tint)); box-shadow: 0 4px 14px rgba(124,92,240,.45); }
.oculto { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
/* Vista previa reducida: es solo una referencia (la impresión usa las hojas a tamaño real) */
.col3 { position: sticky; top: 84px; }
.col3 details.card summary { padding: 14px 16px; font-size: 13px; flex-wrap: wrap; gap: 2px 8px; }
.col3 details.card summary small { margin-left: 0; font-size: 11px; flex-basis: 100%; order: 3; }
.col3 .prev-body { padding: 0 14px 16px; }
.vista { zoom: .24; } .vista .hoja { box-shadow: 0 6px 24px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.1); }
@media (max-width: 520px) { .acciones { grid-template-columns: 1fr 1fr; } }
#impresion { display: none; }
.modal { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 20px; background: rgba(6,6,10,.62); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); opacity: 0; transition: opacity .18s; }
.modal.abierto { opacity: 1; }
.modal-card { width: min(92vw, 380px); max-height: 90vh; overflow: auto; text-align: center; background: linear-gradient(150deg, var(--card2), var(--card) 60%); border: 1px solid rgba(255,255,255,.06); border-radius: 30px; padding: 30px 26px 24px;
  box-shadow: 0 30px 80px rgba(0,0,0,.65), inset 0 1px 0 rgba(255,255,255,.07); transform: scale(.92); transition: transform .22s cubic-bezier(.3,.9,.4,1.2); }
.modal.abierto .modal-card { transform: scale(1); }
.modal-card h2 { margin: 16px 0 6px; font-size: 20px; letter-spacing: -.02em; text-transform: none; color: var(--txt); }
.modal-card p { margin: 0 0 18px; color: var(--sub); white-space: pre-line; }
.modal-card img { max-width: 100%; border-radius: 12px; border: 1px solid var(--line); margin-bottom: 18px; }
.modal-card .btn { width: 100%; }
.m-icono { position: relative; width: 64px; height: 64px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 30px; font-weight: 700; }
.m-ok { background: var(--ok); box-shadow: 0 0 28px rgba(61,220,151,.45); } .m-ok::after { content: ""; position: absolute; left: 24px; top: 11px; width: 13px; height: 26px; border: solid #fff; border-width: 0 5px 5px 0; transform: rotate(45deg); animation: sube .3s ease-out; }
.m-error { background: var(--err); box-shadow: 0 0 28px rgba(255,107,129,.45); }
.m-info { background: linear-gradient(135deg, var(--tint2), var(--tint)); box-shadow: 0 0 28px rgba(124,92,240,.5); }
.m-carga { border: 5px solid #2b2c38; border-top-color: var(--tint); animation: gira .8s linear infinite; }
@keyframes gira { to { transform: rotate(360deg); } }
@keyframes sube { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ===== Hoja y cartel (misma estructura en vista previa e impresión) ===== */
.hoja, .cartel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.hoja { display: block; width: 210mm; height: 296mm; background: #fff; overflow: hidden; break-after: page; }
.hoja:last-child { break-after: auto; }
.cartel { --k: 1; width: 100%; height: 148mm; padding: 5mm 9mm; display: flex; flex-direction: column; align-items: center;
  text-align: center; overflow: hidden; background: #fff; color: #000; line-height: 1.05;
  font-family: "Times New Roman", Times, "Liberation Serif", serif; }
.hoja .cartel:first-child { border-bottom: .3mm dashed #000; } /* línea de corte */
.cartel > * { max-width: 100%; overflow-wrap: break-word; }
.bulto { font-size: max(8pt, calc(11pt * var(--k))); font-weight: 700; }
.razon { font-size: max(16pt, calc(36pt * var(--k))); font-weight: 700; }
.fant, .dir, .tel { font-size: max(12pt, calc(28pt * var(--k))); }
.dir { white-space: pre-line; }
.zona-depto { flex: 1; display: flex; align-items: center; justify-content: center; }
.depto { font-size: max(28pt, calc(72pt * var(--k))); font-weight: 700; text-transform: uppercase; }
.factura { width: 100%; background: #ff0; border: .3mm solid #000; font-weight: 700; text-transform: uppercase; font-size: max(24pt, calc(55pt * var(--k))); }
.cond { width: 100%; background: #fff; border: .3mm solid #000; font-weight: 700; text-transform: uppercase; font-size: max(12pt, calc(24pt * var(--k))); margin-top: 1.5mm; }
.rte1 { color: #f00; font-size: max(12pt, calc(28pt * var(--k))); margin-top: 1.5mm; }
.rte2 { color: #f00; font-size: max(9pt, calc(18pt * var(--k))); }

/* ===== Formato E (cuadros) =====
   La altura se reparte entre los recuadros por pesos (flex) y cada texto crece hasta el MAYOR tamaño que entra en su recuadro
   (ajustarE en JavaScript.html). Una palabra: una línea. Varias palabras: hasta 2 líneas. El remitente tiene tamaño fijo. */
.cartel-e { padding: 5mm 7mm; gap: 2mm; align-items: stretch; justify-content: flex-start; }
.cartel-e .fit { display: block; width: 100%; min-width: 0; font-size: 400px; line-height: 1.05; overflow-wrap: normal; word-break: normal; hyphens: none; }
.cartel-e .fit.uno { white-space: nowrap; }
.e-box { border: .5mm solid #000; padding: 1mm 2.5mm; overflow: hidden; display: flex; flex-direction: column; justify-content: center; align-items: center; min-width: 0; background: #fff; }
.e-top, .e-foot { display: flex; gap: 2mm; flex: none; }
.e-top { height: 18mm; } .e-foot { height: 22mm; }
.e-top > *, .e-foot > * { flex: 1 1 0; min-width: 0; }
.e-vacio { border: 0; background: none; } /* lado sin dato: queda en blanco, sin recuadro */
.e-factura { background: #ff0; }
.e-fant, .e-prim { flex: 2.6 1 0; min-height: 0; }   /* nombre fantasía: el texto principal del cartel */
.e-razon { flex: 1.5 1 0; min-height: 0; }
.e-dt { flex: 1.6 1 0; min-height: 0; flex-direction: row; padding: 0; align-items: stretch; justify-content: stretch; }
.e-celda { flex: 1 1 0; min-width: 0; padding: 1mm 2.5mm; display: flex; align-items: center; justify-content: center; }
.e-celda + .e-celda { border-left: .5mm solid #000; }
.e-depto { flex: 3.3 1 0; min-height: 0; }
.e-rte { gap: 0; }
.e-rte .rte1 { color: #f00; font-size: 26px; line-height: 1.05; }
.e-rte .rte2 { color: #f00; font-size: 17px; line-height: 1.05; }
.e-fant .fit, .e-prim .fit, .e-depto .fit, .e-cond .fit, .e-factura .fit, .e-bulto .fit { font-weight: 700; }
.e-depto .fit, .e-cond .fit, .e-factura .fit { text-transform: uppercase; }
/* FRÁGIL: una hoja A4 apaisada por bulto; cartel al centro y dos franjas laterales solo con contorno (sin relleno, para ahorrar tinta) */
.hoja.fragil { width: 297mm; height: 209mm; display: flex; align-items: stretch; }
.barra-fragil { flex: none; width: 33.3mm; margin: 6.35mm 0 6.35mm 6.35mm; border: 1.3mm solid #000; background: #fff; color: #000; display: flex; align-items: center; justify-content: center;
  writing-mode: vertical-rl; font: 700 104px/1.05 "Times New Roman", Times, "Liberation Serif", serif; letter-spacing: .14em; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.barra-fragil.b-izq { transform: rotate(180deg); }
.barra-fragil.b-der { margin: 6.35mm 6.35mm 6.35mm 0; }
.cartel.cartel-e.ancha { width: 217.7mm; height: 209mm; padding: 6.35mm; border-bottom: 0; flex: none; }
.ancha .e-top { height: 20.5mm; } .ancha .e-foot { height: 26mm; }
.ancha .e-rte .rte1 { font-size: 30px; } .ancha .e-rte .rte2 { font-size: 20px; }
.vista.fragil { zoom: .17; }
.nota { margin: -2px 0 6px; font-size: 12px; color: var(--sub); }

/* ===== Impresión A4 vertical (con FRÁGIL, JavaScript.html agrega @page apaisada en #pagina) ===== */
@page { size: A4 portrait; margin: 0; }
@media print {
  html, body { margin: 0; padding: 0; background: #fff; height: auto; overflow: visible; }
  .no-print { display: none !important; }
  #impresion { display: block; }
}
</style>
