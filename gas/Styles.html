<style id="estilos">
/* ===== Interfaz (solo pantalla) ===== */
* { box-sizing: border-box; }
body { margin: 0; font: 15px/1.4 system-ui, sans-serif; color: #1c1c1c; background: #e9e7e3; }
.ui { max-width: 1100px; margin: 0 auto; padding: 16px; }
h1 { font-size: 20px; margin: 0 0 12px; }
.barra { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
button { font: inherit; padding: 8px 14px; border: 1px solid #333; background: #fff; border-radius: 4px; cursor: pointer; }
button.principal { background: #1c1c1c; color: #fff; }
.estado { padding: 8px 12px; background: #fff; border-left: 4px solid #888; }
.estado.ok { border-color: #2e7d32; }
.estado.error { border-color: #b71c1c; }
.aviso { font-size: 13px; color: #555; }
#png-res img { max-width: 100%; border: 1px solid #999; margin-top: 8px; }
.vista { zoom: .5; display: flex; flex-direction: column; gap: 16px; align-items: center; }

.cols { display: grid; grid-template-columns: minmax(320px, 420px) 1fr; gap: 20px; align-items: start; }
.col label { display: block; font-size: 13px; font-weight: 600; margin: 10px 0 3px; }
.col input[type=text], .col textarea { width: 100%; font: inherit; padding: 7px 9px; border: 1px solid #888; border-radius: 4px; background: #fff; }
.col textarea { resize: vertical; }
.check { display: flex; align-items: center; gap: 8px; font-weight: 600; margin: 10px 0; }
.buscador { position: relative; }
.sugerencias { position: absolute; left: 0; right: 0; z-index: 5; margin: 2px 0 0; padding: 0; list-style: none; background: #fff; border: 1px solid #555; border-radius: 4px; }
.sugerencias li { padding: 7px 10px; cursor: pointer; }
.sugerencias li.sel, .sugerencias li:hover { background: #e3e8f3; }
.origen { font-size: 13px; color: #444; margin: 8px 0 0; }
.resumen { padding: 10px 12px; background: #fff; border-left: 4px solid #2e7d32; margin: 0 0 12px; }
.avisos { color: #b71c1c; font-weight: 600; margin: 0 0 8px; }
.resumen.error { border-color: #b71c1c; }

/* ===== Hoja y cartel (misma estructura en vista previa e impresión) ===== */
.hoja, .cartel { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
.hoja { display: block; width: 210mm; height: 296mm; background: #fff; overflow: hidden; break-after: page; }
.hoja:last-child { break-after: auto; }
.cartel { --k: 1; width: 100%; height: 148mm; padding: 5mm 9mm; display: flex; flex-direction: column; align-items: center;
  text-align: center; overflow: hidden; background: #fff; color: #000; line-height: 1.05;
  font-family: "Times New Roman", Times, "Liberation Serif", serif; }
.hoja .cartel:first-child { border-bottom: .3mm dashed #000; } /* línea de corte */
.cartel > * { max-width: 100%; overflow-wrap: break-word; }
.bulto { font-size: max(8pt, calc(11pt * var(--k))); font-weight: 700; }
.razon { font-size: max(16pt, calc(36pt * var(--k))); font-weight: 700; }
.fant, .dir, .tel { font-size: max(12pt, calc(28pt * var(--k))); }
.dir { white-space: pre-line; }
.zona-depto { flex: 1; display: flex; align-items: center; justify-content: center; }
.depto { font-size: max(28pt, calc(72pt * var(--k))); font-weight: 700; text-transform: uppercase; }
.factura { width: 100%; background: #ff0; border: .3mm solid #000; font-weight: 700; text-transform: uppercase; font-size: max(24pt, calc(55pt * var(--k))); }
.cond { width: 100%; background: #fff; border: .3mm solid #000; font-weight: 700; text-transform: uppercase; font-size: max(12pt, calc(24pt * var(--k))); margin-top: 1.5mm; }
.rte1 { color: #f00; font-size: max(12pt, calc(28pt * var(--k))); margin-top: 1.5mm; }
.rte2 { color: #f00; font-size: max(9pt, calc(18pt * var(--k))); }

/* ===== Impresión A4 vertical ===== */
@page { size: A4 portrait; margin: 0; }
@media print {
  html, body { margin: 0; padding: 0; background: #fff; height: auto; overflow: visible; }
  .no-print { display: none !important; }
  .ui { max-width: none; margin: 0; padding: 0; }
  .cols { display: block; }
  .vista { zoom: 1; display: block; gap: 0; }
}
</style>
