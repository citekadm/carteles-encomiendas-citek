<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var clientes = [];

  // Regla pura: búsqueda sin mayúsculas ni tildes; la ñ cuenta como n.
  function norm(s) {
    return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
  }
  // DOM siempre con textContent (nunca innerHTML con datos de la hoja).
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt != null) e.textContent = txt;
    return e;
  }

  // ---- Cartel (prototipo: tamaños de referencia como máximos) ----
  function crearCartel(d) {
    var c = el('div', 'cartel');
    c.appendChild(el('div', 'bulto', 'BULTO ' + d.n + ' DE ' + d.total));
    c.appendChild(el('div', 'razon', d.razon));
    if (d.fantasia && norm(d.fantasia) !== norm(d.razon)) c.appendChild(el('div', 'fant', '\u201C' + d.fantasia + '\u201D'));
    if (d.dir) c.appendChild(el('div', 'dir', d.dir));
    if (d.tel) c.appendChild(el('div', 'tel', 'Tel: ' + d.tel));
    var z = el('div', 'zona-depto');
    z.appendChild(el('div', 'depto', d.depto));
    c.appendChild(z);
    if (d.factura && d.n === 1) c.appendChild(el('div', 'factura', 'FACTURA EN CAJA'));
    if (d.cond) c.appendChild(el('div', 'cond', d.cond));
    c.appendChild(el('div', 'rte1', 'Rte.: Citek Ltda.'));
    c.appendChild(el('div', 'rte2', 'Cerrito 282 bis - Tel.: 2915 5380'));
    c.appendChild(el('div', 'rte2', 'MONTEVIDEO'));
    return c;
  }

  // Reducción en cascada simple (el algoritmo definitivo llega en la Etapa 5).
  function ajustar(c) {
    var k = 1;
    c.style.setProperty('--k', k);
    while (c.scrollHeight > c.clientHeight + 1 && k > 0.4) {
      k -= 0.03;
      c.style.setProperty('--k', k.toFixed(2));
    }
    return c.scrollHeight <= c.clientHeight + 1;
  }

  var OWL = { razon: 'OWL SRL', fantasia: 'Minimarket OWL', dir: 'Av. Soriano Y Dr. Felippone', tel: '4724 1917', depto: 'Paysandu' };
  function m(base, extra) { var o = {}, k; for (k in base) o[k] = base[k]; for (k in extra) o[k] = extra[k]; return o; }
  var MUESTRAS = [
    m(OWL, { n: 1, total: 2, factura: true, cond: '' }),
    m(OWL, { n: 2, total: 2, factura: true, cond: '' }),
    { n: 1, total: 1, factura: true, cond: 'Enviar por Nuñez', razon: 'LICKSOL S.A', fantasia: 'Licksol S.A', dir: 'Rincón Artigas 695\nMELO', tel: '4642 1340', depto: 'Cerro Largo' },
    { n: 1, total: 1, factura: false, cond: '', razon: 'DISTRIBUIDORA DEL ESTE LIMITADA', fantasia: 'Almacén Los Tres Hermanos', dir: 'Avenida Brigadier General Manuel Oribe 1234', tel: '', depto: 'Treinta y Tres' },
    m(OWL, { n: 1, total: 1, factura: true, cond: '' })
  ];

  // Hojas A4: dos carteles por hoja; con cantidad impar la mitad inferior queda vacía.
  function renderVista(lista) {
    var v = $('vista');
    v.textContent = '';
    for (var i = 0; i < lista.length; i += 2) {
      var h = el('div', 'hoja');
      h.appendChild(crearCartel(lista[i]));
      h.appendChild(i + 1 < lista.length ? crearCartel(lista[i + 1]) : el('div', 'cartel vacio'));
      v.appendChild(h);
    }
    var fallos = [];
    Array.prototype.forEach.call(v.querySelectorAll('.cartel:not(.vacio)'), function (c, i) {
      if (!ajustar(c)) fallos.push(i + 1);
    });
    return fallos;
  }

  // ---- PNG del primer cartel: A5 apaisado 210 x 148 mm a 150 dpi (1240 x 874 px), copiado al portapapeles ----
  function generarPNG() {
    var res = $('png-res');
    var c = document.querySelector('.cartel:not(.vacio)');
    res.textContent = '';
    if (!c) { res.textContent = 'Primero cargá las hojas de prueba.'; return; }
    var W = 210 * 96 / 25.4, H = 148 * 96 / 25.4;
    var clon = c.cloneNode(true);
    clon.style.width = '210mm';
    var css = $('estilos').textContent.replace(/&/g, '&amp;').replace(/</g, '&lt;');
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="874" viewBox="0 0 ' + W + ' ' + H + '">' +
      '<foreignObject width="' + W + '" height="' + H + '"><div xmlns="http://www.w3.org/1999/xhtml"><style>' + css + '</style>' +
      new XMLSerializer().serializeToString(clon) + '</div></foreignObject></svg>';

    // La imagen se entrega al portapapeles como promesa para no perder el permiso del clic.
    var blobPromise = new Promise(function (resolve, reject) {
      var img = new Image();
      img.onload = function () {
        try {
          var cv = document.createElement('canvas');
          cv.width = 1240; cv.height = 874;
          var ctx = cv.getContext('2d');
          ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, 1240, 874);
          ctx.drawImage(img, 0, 0, 1240, 874);
          cv.toBlob(function (b) { b ? resolve(b) : reject(new Error('no se obtuvo la imagen')); }, 'image/png');
        } catch (e) { reject(e); }
      };
      img.onerror = function () { reject(new Error('no se pudo renderizar el cartel')); };
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
    });

    // Alternativa si el navegador bloquea el portapapeles: mostrar la imagen para copiarla a mano.
    function mostrar() {
      blobPromise.then(function (b) {
        res.textContent = 'No se pudo copiar automáticamente. Hacé clic derecho sobre la imagen y elegí «Copiar imagen».';
        var im = el('img');
        im.src = URL.createObjectURL(b); im.alt = 'PNG del bulto 1';
        res.appendChild(im);
      }, function (e) { res.textContent = 'No se pudo generar el PNG: ' + e.message; });
    }

    if (navigator.clipboard && window.ClipboardItem) {
      navigator.clipboard.write([new ClipboardItem({ 'image/png': blobPromise })])
        .then(function () { res.textContent = 'PNG del bulto 1 copiado al portapapeles. Pegalo en WhatsApp o en el mail con Ctrl+V.'; })
        .catch(mostrar);
    } else { mostrar(); }
  }

  // ---- Lectura de clientes (Etapa 1) ----
  function cargar() {
    var e = $('estado');
    e.className = 'estado'; e.textContent = 'Leyendo clientes…';
    google.script.run
      .withSuccessHandler(function (r) {
        if (r && r.ok) {
          clientes = r.clientes;
          e.className = 'estado ok';
          var p = clientes[0];
          e.textContent = 'Clientes leídos: ' + clientes.length + (p ? '. Primero: ' + p.cuenta + ' | ' + p.razonSocial + ' | ' + p.departamento : '.');
        } else {
          e.className = 'estado error';
          e.textContent = (r && r.mensaje) || 'Error desconocido al leer clientes.';
        }
      })
      .withFailureHandler(function () {
        e.className = 'estado error';
        e.textContent = 'No se pudo conectar con el servidor.';
      })
      .cargarClientes();
  }

  // ===== Etapa 3: reglas puras (sin DOM ni estado global) =====
  var Reglas = {
    norm: norm,
    validarCajas: function (t) {
      t = String(t == null ? '' : t).trim();
      if (t === '') return { ok: false, mensaje: 'Ingresá la cantidad de cajas.' };
      if (!/^\d+$/.test(t)) return { ok: false, mensaje: 'La cantidad de cajas debe ser un número entero positivo, sin decimales ni signos.' };
      var v = parseInt(t, 10);
      if (v < 1 || v > 999) return { ok: false, mensaje: 'La cantidad de cajas debe estar entre 1 y 999.' };
      return { ok: true, valor: v };
    },
    bultos: function (cajas) { return Math.ceil(cajas / 3); },
    hojas: function (bultos) { return Math.ceil(bultos / 2); },
    // Solo para el resumen en pantalla; nunca se imprime en el cartel.
    agrupacion: function (cajas) {
      var g = Math.floor(cajas / 3), r = cajas % 3, p = [], i;
      if (g <= 4) { for (i = 0; i < g; i++) p.push('3'); if (r) p.push(String(r)); return p.join('+'); }
      return g + ' × 3' + (r ? ' + ' + r : '');
    },
    condPorDefecto: function (t) { return String(t || '').trim() !== ''; },
    // Un descriptor por bulto: numeración correlativa, factura solo en el 1, condición en todos.
    descriptores: function (cajas, o) {
      var total = Reglas.bultos(cajas), texto = String(o.condTexto || '').trim(), out = [];
      for (var n = 1; n <= total; n++) {
        out.push({ n: n, total: total, factura: !!o.factura && n === 1, cond: o.condActiva && texto ? texto : '' });
      }
      return out;
    },
    // Todas las palabras deben aparecer; orden: cuenta exacta, comienzo de campo, resto.
    buscar: function (lista, texto, max) {
      var q = norm(texto);
      if (!q) return [];
      var tk = q.split(' '), out = [];
      lista.forEach(function (c, i) {
        var cu = norm(c.cuenta), rz = norm(c.razonSocial), fa = norm(c.fantasia);
        var todo = cu + ' ' + rz + ' ' + fa;
        for (var j = 0; j < tk.length; j++) if (todo.indexOf(tk[j]) < 0) return;
        var r = cu === q ? 0 : (cu.indexOf(q) === 0 || rz.indexOf(q) === 0 || fa.indexOf(q) === 0) ? 1 : 2;
        out.push({ c: c, r: r, i: i });
      });
      out.sort(function (a, b) { return a.r - b.r || a.i - b.i; });
      return out.slice(0, max || 8).map(function (x) { return x.c; });
    }
  };

  // Autopruebas: ejecutar autopruebas() en la consola del navegador.
  window.autopruebas = function () {
    var fallos = [], total = 0;
    function eq(nombre, got, esp) { total++; if (got !== esp) fallos.push(nombre + ': obtuvo ' + got + ', esperaba ' + esp); }
    [[1, 1], [2, 1], [3, 1], [4, 2], [5, 2], [6, 2], [7, 3], [8, 3], [9, 3], [10, 4], [999, 333]].forEach(function (p) {
      eq('bultos(' + p[0] + ')', Reglas.bultos(p[0]), p[1]);
      eq('descriptores(' + p[0] + ')', Reglas.descriptores(p[0], { factura: true }).length, p[1]);
    });
    ['0', '-1', '1.5', 'abc', '1000', '1e2', ' ', '2 3', '', '+5'].forEach(function (t) { eq('rechaza "' + t + '"', Reglas.validarCajas(t).ok, false); });
    [['1', 1], ['999', 999], [' 7 ', 7]].forEach(function (p) { eq('acepta "' + p[0] + '"', Reglas.validarCajas(p[0]).valor, p[1]); });
    eq('agrupa 4', Reglas.agrupacion(4), '3+1'); eq('agrupa 7', Reglas.agrupacion(7), '3+3+1');
    eq('agrupa 10', Reglas.agrupacion(10), '3+3+3+1'); eq('agrupa 999', Reglas.agrupacion(999), '333 × 3');
    var d = Reglas.descriptores(7, { factura: true, condActiva: true, condTexto: ' Enviar por Nuñez ' });
    eq('factura bulto 1', d[0].factura, true); eq('sin factura bulto 2', d[1].factura, false); eq('sin factura bulto 3', d[2].factura, false);
    eq('condición en todos', d.every(function (x) { return x.cond === 'Enviar por Nuñez'; }), true);
    eq('numeración', d[2].n + '/' + d[2].total, '3/3');
    eq('factura desactivada', Reglas.descriptores(3, { factura: false })[0].factura, false);
    eq('condición desactivada', Reglas.descriptores(3, { condActiva: false, condTexto: 'X' })[0].cond, '');
    eq('condición vacía', Reglas.descriptores(3, { condActiva: true, condTexto: '   ' })[0].cond, '');
    eq('norm ñ', norm('NUÑEZ'), 'nunez'); eq('norm espacios', norm(' Rincón  Artigas '), 'rincon artigas');
    var L = [{ cuenta: '00123', razonSocial: 'Núñez Hnos', fantasia: 'Almacén Sol' }, { cuenta: '0456', razonSocial: 'Sol SA', fantasia: '' }];
    eq('busca ñ como n', Reglas.buscar(L, 'NUNEZ').length, 1);
    eq('busca varias palabras', Reglas.buscar(L, 'almacen SOL').length, 1);
    eq('busca cuenta exacta primero', Reglas.buscar(L, '0456')[0].cuenta, '0456');
    eq('comienzo antes que resto', Reglas.buscar(L, 'sol')[0].cuenta, '0456');
    var G = []; for (var i = 0; i < 20; i++) G.push({ cuenta: 'A' + i, razonSocial: 'Cliente ' + i, fantasia: '' });
    eq('máximo 8', Reglas.buscar(G, 'cliente').length, 8);
    eq('búsqueda vacía', Reglas.buscar(G, '  ').length, 0);
    console.log(fallos.length ? 'FALLOS (' + fallos.length + ' de ' + total + '):\n' + fallos.join('\n') : 'Autopruebas OK: ' + total + ' comprobaciones.');
    return { total: total, fallos: fallos };
  };

  // ===== Etapa 4: formulario, búsqueda y estado temporal (solo en memoria) =====
  var CAMPOS = { razon: 'f-razon', fantasia: 'f-fantasia', dir: 'f-dir', tel: 'f-tel', depto: 'f-depto' };
  var estado, sel = -1, sugerencias = [];
  function estadoVacio() {
    return { origen: 'manual', cuenta: '', razon: '', fantasia: '', dir: '', tel: '', depto: '', cond: '', condActiva: false, condManual: false, factura: true, cajas: '' };
  }
  function resumen() {
    var r = $('resumen'), v = Reglas.validarCajas(estado.cajas);
    r.className = 'resumen' + (v.ok || estado.cajas.trim() === '' ? '' : ' error');
    if (!v.ok) { r.textContent = v.mensaje; return; }
    var b = Reglas.bultos(v.valor), h = Reglas.hojas(b);
    r.textContent = v.valor + (v.valor > 1 ? ' cajas' : ' caja') + ' → ' + b + (b > 1 ? ' bultos' : ' bulto') + ' (' + Reglas.agrupacion(v.valor) + '). ' +
      h + (h > 1 ? ' hojas' : ' hoja') + ' A4' + (b % 2 ? '; la mitad inferior de la última queda vacía.' : '.');
  }
  function volcar() { // estado -> formulario
    for (var k in CAMPOS) $(CAMPOS[k]).value = estado[k];
    $('f-cond').value = estado.cond; $('c-cond').checked = estado.condActiva;
    $('c-factura').checked = estado.factura; $('f-cajas').value = estado.cajas;
    $('origen').textContent = estado.origen === 'base'
      ? 'Cliente de la base (cuenta ' + estado.cuenta + '). Los cambios valen solo para este envío.'
      : 'Cliente manual: no se guarda en la base.';
    resumen();
  }
  function cerrarLista() { $('sugerencias').hidden = true; $('sin-res').hidden = true; sel = -1; }
  function elegir(c) { // copia de los datos; la base nunca se modifica
    estado.origen = 'base'; estado.cuenta = c.cuenta; estado.razon = c.razonSocial; estado.fantasia = c.fantasia;
    estado.dir = c.direccion; estado.tel = c.telefono; estado.depto = c.departamento;
    estado.cond = c.condicion; estado.condActiva = Reglas.condPorDefecto(c.condicion); estado.condManual = false;
    $('f-buscar').value = ''; cerrarLista(); volcar();
  }
  function marcar() {
    Array.prototype.forEach.call($('sugerencias').children, function (li, i) { li.className = i === sel ? 'sel' : ''; });
  }
  function mostrarLista() {
    var ul = $('sugerencias'), q = $('f-buscar').value.trim();
    ul.textContent = ''; sel = -1;
    sugerencias = Reglas.buscar(clientes, q, 8);
    sugerencias.forEach(function (c) {
      var li = el('li', null, c.cuenta + ' — ' + c.razonSocial + (c.fantasia ? ' (' + c.fantasia + ')' : ''));
      li.onmousedown = function (e) { e.preventDefault(); elegir(c); };
      ul.appendChild(li);
    });
    ul.hidden = !sugerencias.length;
    $('sin-res').hidden = !(q && !sugerencias.length);
  }
  $('f-buscar').addEventListener('input', mostrarLista);
  $('f-buscar').addEventListener('blur', cerrarLista);
  $('f-buscar').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      if (!sugerencias.length) return;
      e.preventDefault();
      sel = (sel + (e.key === 'ArrowDown' ? 1 : -1) + sugerencias.length) % sugerencias.length; marcar();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (sugerencias.length) elegir(sugerencias[sel >= 0 ? sel : 0]);
    } else if (e.key === 'Escape') { cerrarLista(); }
  });
  Object.keys(CAMPOS).forEach(function (k) {
    $(CAMPOS[k]).addEventListener('input', function () { estado[k] = this.value; });
  });
  // La casilla de condición sigue al texto hasta que el usuario la toca.
  $('f-cond').addEventListener('input', function () {
    estado.cond = this.value;
    if (!estado.condManual) { estado.condActiva = Reglas.condPorDefecto(this.value); $('c-cond').checked = estado.condActiva; }
  });
  $('c-cond').addEventListener('change', function () { estado.condManual = true; estado.condActiva = this.checked; });
  $('c-factura').addEventListener('change', function () { estado.factura = this.checked; });
  $('f-cajas').addEventListener('input', function () { estado.cajas = this.value; resumen(); });
  $('b-nuevo').onclick = function () {
    estado = estadoVacio();
    $('f-buscar').value = ''; cerrarLista(); volcar();
    $('vista').textContent = ''; $('png-res').textContent = '';
  };
  estado = estadoVacio();
  volcar();

  $('b-recargar').onclick = cargar;
  $('b-prueba').onclick = function () {
    var f = renderVista(MUESTRAS);
    $('estado').className = f.length ? 'estado error' : 'estado ok';
    $('estado').textContent = f.length ? 'Carteles que no entran ni al tamaño mínimo: ' + f.join(', ') : 'Hojas de prueba generadas (' + MUESTRAS.length + ' carteles).';
  };
  $('b-imprimir').onclick = function () { window.print(); };
  $('b-png').onclick = generarPNG;
  cargar();
})();
</script>
