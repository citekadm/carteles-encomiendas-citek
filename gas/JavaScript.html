  // ---- Cartel (cuadros) ----

  var MIN_E = { razon: 14, fant: 14, dir: 14, tel: 14, cond: 14, factura: 20, bulto: 14, depto: 36 }; // px, mínimo legible
  function crearCartelE(d, ancha) {

    c.dataset.v = d.factura ? 'a' : 'b'; // variante de ajuste: con o sin FACTURA EN CAJA
    function fit(rol, txt, lineas) {
      var e = el('div', 'fit f-' + rol + (lineas === 1 ? ' uno' : ''), txt);
      e.dataset.r = rol; e.dataset.l = lineas;
      return e;
    }
    var varias = function (t) { return /\s/.test(String(t).trim()) ? 2 : 1; };
    if (hayTop) { // condición y factura comparten la franja superior; si hay solo una, ocupa todo el ancho
      var top = el('div', 'e-top');
      if (d.cond) { var bc = el('div', 'e-box e-cond'); bc.appendChild(fit('cond', d.cond, varias(d.cond))); top.appendChild(bc); }
      if (d.factura) { var bfa = el('div', 'e-box e-factura'); bfa.appendChild(fit('factura', 'FACTURA EN CAJA', 1)); top.appendChild(bfa); }
      c.appendChild(top);
    }
    // Nombre fantasía = texto principal (lo que ve el cadete). Si no hay, la razón social pasa a ser la principal.
    var fant = d.fantasia && norm(d.fantasia) !== norm(d.razon) ? '\u201C' + d.fantasia + '\u201D' : '';
    if (fant) { var bf = el('div', 'e-box e-fant'); bf.appendChild(fit('fant', fant, varias(fant))); c.appendChild(bf); }
    if (d.razon) { var br = el('div', 'e-box e-razon' + (fant ? '' : ' e-prim')); br.appendChild(fit('razon', d.razon, varias(d.razon))); c.appendChild(br); }
    if (d.dir || d.tel) {
      var dt = el('div', 'e-box e-dt'), dir = d.dir.replace(/\s*\n\s*/g, ' '), tel = d.tel ? 'Tel: ' + d.tel : '';
      // El ancho de cada celda se reparte según el largo de su texto, para que ambos crezcan parejo.
      // Una dirección larga ocupa 2 líneas, así que necesita la mitad de ancho; el teléfono va siempre en una línea.
      if (dir) { var a = el('div', 'e-celda'); a.style.flexGrow = Math.max(6, dir.length > 24 ? dir.length / 2 : dir.length); a.appendChild(fit('dir', dir, varias(dir))); dt.appendChild(a); }
      if (tel) { var t = el('div', 'e-celda'); t.style.flexGrow = Math.max(6, tel.length); t.appendChild(fit('tel', tel, 1)); dt.appendChild(t); }

    if (!estado.condManual) { estado.condActiva = Reglas.condPorDefecto(this.value); $('c-cond').checked = estado.condActiva; }
  });
  $('c-cond').addEventListener('change', function () { estado.condManual = true; estado.condActiva = this.checked; });
  $('c-factura').addEventListener('change', function () { estado.factura = this.checked; });
  $('c-fragil').addEventListener('change', function () { estado.fragil = this.checked; sincronizarFragil(); resumen(); });
  $('f-cajas').addEventListener('input', function () { estado.cajas = this.value; resumen(); });
  // Botones − / + y flechas del teclado: suman o restan 1 dentro del rango 1–999 reutilizando el evento 'input'.
  function pasoCajas(d) {
    var f = $('f-cajas'), v = Reglas.validarCajas(f.value), n = v.ok ? v.valor + d : 1;
    f.value = String(Math.min(999, Math.max(1, n)));
    f.dispatchEvent(new Event('input', { bubbles: true }));
  }
  $('b-mas').onclick = function () { pasoCajas(1); };
  $('b-menos').onclick = function () { pasoCajas(-1); };
  $('f-cajas').addEventListener('keydown', function (e) {
    if (e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); pasoCajas(e.key === 'ArrowUp' ? 1 : -1); }
  });
  $('b-nuevo').onclick = function () {
    generado = false; clearTimeout(timer);
    estado = estadoVacio(); // FRÁGIL y las cajas por bulto vuelven a sus valores por defecto
    $('f-buscar').value = ''; cerrarLista(); volcar();
    limpiarSalida();
  };

  // ===== Autocompletado en los campos de datos: si el cliente ya existe, se ofrece al ir escribiendo =====
  function autoCampo(idInput, idUl) {
    var inp = $(idInput), ul = $(idUl), lista = [], pos = -1;
    function cerrar() { ul.hidden = true; ul.textContent = ''; lista = []; pos = -1; }
    function marcarPos() { Array.prototype.forEach.call(ul.children, function (li, i) { li.className = i === pos ? 'sel' : ''; }); }
    inp.addEventListener('input', function () {
      var q = inp.value.trim();
      cerrar();
      if (estado.origen === 'base' || norm(q).length < 2) return; // con un cliente de la base ya elegido no se ofrece nada
      lista = Reglas.buscar(clientes, q, 8);
      lista.forEach(function (c) {
        var li = el('li', null, c.cuenta + ' — ' + c.razonSocial + (c.fantasia ? ' (' + c.fantasia + ')' : ''));
        li.onmousedown = function (e) { e.preventDefault(); cerrar(); elegir(c); };
        ul.appendChild(li);
      });
      ul.hidden = !lista.length;
    });
    inp.addEventListener('blur', cerrar);
    inp.addEventListener('keydown', function (e) {
      if (ul.hidden || !lista.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        pos = (pos + (e.key === 'ArrowDown' ? 1 : -1) + lista.length) % lista.length; marcarPos();
      } else if (e.key === 'Enter' && pos >= 0) {
        e.preventDefault(); var c = lista[pos]; cerrar(); elegir(c);
      } else if (e.key === 'Escape') { cerrar(); }
    });
  }
  autoCampo('f-razon', 'sug-razon');
  autoCampo('f-fantasia', 'sug-fantasia');

  // ===== Nuevo cliente: único guardado en la base, solo al tocar el botón y confirmar =====
  function modalConfirmar(o) { // o: titulo, texto, campo{etiqueta}, ok, alOk(valorCampo)
    var m = $('modal'), card = $('modal-card'), inp = null;
    card.textContent = '';
    card.appendChild(el('div', 'm-icono m-info', '+'));
    card.appendChild(el('h2', null, o.titulo));
    if (o.texto) card.appendChild(el('p', null, o.texto));
    if (o.campo) {
      card.appendChild(el('label', 'f', o.campo.etiqueta));
      inp = el('input'); inp.type = 'text'; inp.autocomplete = 'off'; inp.maxLength = 50;
      card.appendChild(inp);
    }
    var fila = el('div', 'm-botones'), cancelar = el('button', 'btn', 'Cancelar'), ok = el('button', 'btn prim', o.ok);
    cancelar.type = 'button'; ok.type = 'button';
    cancelar.onclick = cerrarModal;
    ok.onclick = function () { o.alOk(inp ? inp.value.trim() : ''); };
    if (inp) inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); ok.click(); } });
    fila.appendChild(cancelar); fila.appendChild(ok); card.appendChild(fila);
    m.dataset.tipo = 'confirmar'; m.dataset.cerrado = '';
    m.hidden = false;
    requestAnimationFrame(function () { if (!m.dataset.cerrado) m.classList.add('abierto'); });
    setTimeout(function () { (inp || ok).focus(); }, 50);
  }
  function guardarNuevoCliente() {
    var datos = { cuenta: '', razonSocial: estado.razon.trim(), fantasia: estado.fantasia.trim(), direccion: estado.dir.trim(),
      telefono: estado.tel.trim(), departamento: estado.depto.trim(), condicion: estado.cond.trim() };
    if (!datos.razonSocial) {
      modal({ tipo: 'info', titulo: 'Falta la razón social', texto: 'Completá al menos la razón social para agregar el cliente.' });
      return;
    }
    function pedirCuenta() {
      modalConfirmar({
        titulo: '¿Agregar número de cuenta?',
        texto: 'Se guardará «' + datos.razonSocial + '» en la base' + (datos.condicion ? ' con la condición especial «' + datos.condicion + '».' : '.') + ' Si no escribís cuenta, queda sin cuenta.',
        campo: { etiqueta: 'Número de cuenta (opcional)' }, ok: 'Guardar cliente',
        alOk: function (cuenta) {
          if (cuenta && clientes.some(function (c) { return norm(c.cuenta) === norm(cuenta); })) {
            modal({ tipo: 'error', titulo: 'La cuenta ya existe', texto: 'La cuenta ' + cuenta + ' ya está en la base. No se agregó nada.' });
            return;
          }
          datos.cuenta = cuenta;
          enviar();
        }
      });
    }
    function enviar() {
      modal({ tipo: 'carga', titulo: 'Guardando cliente…', texto: 'Agregando a la base.' });
      google.script.run
        .withSuccessHandler(function (r) {
          if (r && r.ok) {
            clientes.push(r.cliente);
            estado.origen = 'base'; estado.cuenta = r.cliente.cuenta;
            $('estado').textContent = clientes.length + (clientes.length === 1 ? ' cliente cargado' : ' clientes cargados');
            volcar();
            modal({ tipo: 'ok', titulo: 'Cliente agregado a la base', texto: r.cliente.razonSocial + (r.cliente.cuenta ? ' · cuenta ' + r.cliente.cuenta : ' · sin cuenta') });
          } else {
            modal({ tipo: 'error', titulo: 'No se guardó el cliente', texto: (r && r.mensaje) || 'Error desconocido.' });
          }
        })
        .withFailureHandler(function () {
          modal({ tipo: 'error', titulo: 'No se pudo confirmar el guardado', texto: 'No hubo respuesta del servidor. Tocá «Recargar clientes» para comprobar si el cliente se agregó antes de reintentar.' });
        })
        .agregarCliente(datos);
    }
    var iguales = Reglas.existentes(clientes, datos.razonSocial);
    if (iguales.length) {
      modalConfirmar({
        titulo: 'Ya existe esa razón social',
        texto: iguales.slice(0, 3).map(function (c) { return (c.cuenta || 'sin cuenta') + (c.direccion ? ' · ' + c.direccion.replace(/\s+/g, ' ') : ''); }).join('\n') +
          '\n¿Agregar igual como cliente nuevo (por ejemplo, otra dirección)?',
        ok: 'Agregar igual', alOk: pedirCuenta
      });
    } else { pedirCuenta(); }
  }
  $('b-nuevo-cli').onclick = guardarNuevoCliente;

  estado = estadoVacio();
  volcar();

  $('b-recargar').onclick = cargar;
  $('b-generar').onclick = function () {
    var v = Reglas.validarCajas(estado.cajas);
    if (!v.ok) {
      generado = false; limpiarSalida();
      resumen(); $('resumen').classList.add('error');
      return;
    }
    generado = true;
    renderCarteles();
  };
  ['input', 'change'].forEach(function (t) {
    document.querySelector('.grid').addEventListener(t, function (e) { if (e.target.id !== 'f-buscar') actualizar(); });
  });
  $('b-imprimir').onclick = function () {
    if (!document.querySelector('#impresion .cartel:not(.vacio)')) { modal({ tipo: 'info', titulo: 'Primero generá los carteles', texto: 'Tocá «Generar carteles» y después imprimí.' }); return; }
    window.print();
  };
  $('b-png').onclick = generarPNG;
  $('modal').addEventListener('click', function (e) { if (e.target.id === 'modal' && $('modal').dataset.tipo !== 'carga') cerrarModal(); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && !$('modal').hidden && $('modal').dataset.tipo !== 'carga') cerrarModal(); });
  cargar();
})();
</script>
